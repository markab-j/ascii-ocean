<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii ocean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --page: #000; --panel: #071015ed; --ink: #d7e5e9; --muted: #8cabb6; --line: #36515e; --field: #101e26; --accent: #64d8e8; }
      :root[data-theme="light"] { color-scheme: light; --page: #f1f5f4; --panel: #f1f5f4f5; --ink: #244451; --muted: #52707b; --line: #9bb0b6; --field: #e6edeb; --accent: #23768d; }
      html, body { margin: 0; height: 100%; background: var(--page); }
      canvas { display: block; width: 100vw; height: 100vh; font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
      * { box-sizing: border-box; }
      .controls { position: fixed; z-index: 1; top: 20px; right: 20px; width: 260px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); font: 13px/1.5 system-ui, sans-serif; backdrop-filter: blur(14px); }
      .controls summary { cursor: pointer; font-size: 16px; font-weight: 600; letter-spacing: .05em; }
      .controls p { color: var(--muted); font-size: 12px; }
      .controls label { display: block; margin-top: 16px; }
      .controls select, .controls button, .controls input[type="text"], .controls input[type="number"] { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); font: inherit; }
      .controls input[type="checkbox"] { accent-color: #64d8e8; }
      .controls :focus-visible { outline: 2px solid #78e3f0; outline-offset: 3px; }
      .controls [role="status"] { color: #ffc3ad; }
      @media (max-width: 600px) { .controls { top: 16px; right: 16px; padding: 14px; } }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <details class="controls" open>
      <summary>ascii ocean</summary>
      <button id="theme" type="button" aria-label="라이트 모드로 전환" aria-pressed="false">라이트</button>
      <p>빛과 글자로 만드는 작은 바다</p>
      <label for="creatures">생물 구성
        <select id="creatures">
          <option value="sharks">상어</option>
          <option value="jellyfish">보름달물해파리</option>
          <option value="mixed">상어와 해파리</option>
        </select>
      </label>
      <label for="glyphs">글자
        <select id="glyphs">
          <option value="ascii">특수문자 · ASCII</option>
          <option value="hangul">한글 · Hangul</option>
        </select>
      </label>
      <label><input id="neon" type="checkbox" /> 생물 네온</label>
      <label for="neon-colors">네온 색상 · HEX, 쉼표로 구분
        <input id="neon-colors" type="text" value="#65dfff" spellcheck="false" pattern="\s*#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*(?:,\s*#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*)*" />
      </label>
      <label for="neon-mode">네온 표현
        <select id="neon-mode">
          <option value="cycle">부드러운 색상 전환</option>
          <option value="gradient">생물별 그라데이션</option>
        </select>
      </label>
      <label for="wave-direction">물결 방향
        <select id="wave-direction">
          <option value="90">위에서 아래</option>
          <option value="270">아래에서 위</option>
          <option value="0">왼쪽에서 오른쪽</option>
          <option value="180">오른쪽에서 왼쪽</option>
          <option value="custom">각도 직접 지정</option>
          <option value="random">물결마다 랜덤</option>
        </select>
      </label>
      <label><input id="plankton" type="checkbox" /> 발광 플랑크톤</label>
      <label for="wave-angle">물결 각도 · 0–360°
        <input id="wave-angle" type="number" min="0" max="360" step="1" value="90" disabled required />
      </label>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </details>
    <script type="module" src="/demo.ts"></script>
  </body>
</html>
