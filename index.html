<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii ocean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
      * { box-sizing: border-box; }
      .controls { position: fixed; z-index: 1; top: 20px; right: 20px; width: 260px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 20px; border: 1px solid #263a43; border-radius: 14px; background: #071015ed; color: #d7e5e9; font: 13px/1.5 system-ui, sans-serif; backdrop-filter: blur(14px); }
      .controls summary { cursor: pointer; font-size: 16px; font-weight: 600; letter-spacing: .05em; }
      .controls p { color: #8cabb6; font-size: 12px; }
      .controls label { display: block; margin-top: 16px; }
      .controls select, .controls input[type="text"], .controls input[type="number"] { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 1px solid #36515e; border-radius: 6px; background: #101e26; color: #edfaff; font: inherit; }
      .controls input[type="checkbox"] { accent-color: #64d8e8; }
      .controls :focus-visible { outline: 2px solid #78e3f0; outline-offset: 3px; }
      .controls [role="status"] { color: #ffc3ad; }
      @media (max-width: 600px) { .controls { top: 16px; right: 16px; padding: 14px; } }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <details class="controls" open>
      <summary>ascii ocean</summary>
      <p>빛과 글자로 만드는 작은 바다</p>
      <label for="glyphs">글자
        <select id="glyphs">
          <option value="ascii">특수문자 · ASCII</option>
          <option value="hangul">한글 · Hangul</option>
        </select>
      </label>
      <label><input id="neon" type="checkbox" /> 생물 네온</label>
      <label for="neon-colors">네온 색상 · HEX, 쉼표로 구분
        <input id="neon-colors" type="text" value="#65dfff" spellcheck="false" />
      </label>
      <label for="neon-mode">네온 표현
        <select id="neon-mode">
          <option value="cycle">부드러운 색상 전환</option>
          <option value="gradient">생물별 그라데이션</option>
        </select>
      </label>
      <p id="settings-status" role="status" aria-live="polite"></p>
    </details>
    <script type="module" src="/demo.ts"></script>
  </body>
</html>
